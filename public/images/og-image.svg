<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#020B18"/>

  <!-- Mesh gradients -->
  <radialGradient id="g1" cx="40%" cy="30%" r="50%">
    <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#020B18" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="g2" cx="80%" cy="10%" r="50%">
    <stop offset="0%" stop-color="#6366F1" stop-opacity="0.1"/>
    <stop offset="100%" stop-color="#020B18" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>

  <!-- Grid lines -->
  <g stroke="#0EA5E9" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Logo icon -->
  <rect x="80" y="80" width="56" height="56" rx="12" fill="#0EA5E9"/>
  <text x="108" y="120" font-family="system-ui,sans-serif" font-size="34" font-weight="700" fill="white" text-anchor="middle">⚡</text>

  <!-- Brand name -->
  <text x="152" y="118" font-family="Inter,system-ui,sans-serif" font-size="36" font-weight="700" fill="white">IRFA<tspan fill="#38BDF8">tech</tspan></text>

  <!-- Tagline -->
  <text x="80" y="156" font-family="Inter,system-ui,sans-serif" font-size="16" fill="#64748B">Integrated Resources For Automation</text>

  <!-- Main headline -->
  <text x="80" y="280" font-family="Inter,system-ui,sans-serif" font-size="58" font-weight="800" fill="white">Digital Infrastructure</text>
  <text x="80" y="350" font-family="Inter,system-ui,sans-serif" font-size="58" font-weight="800" fill="url(#headline-grad)">for Growing Businesses</text>
  <linearGradient id="headline-grad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#38BDF8"/>
    <stop offset="100%" stop-color="#818CF8"/>
  </linearGradient>

  <!-- Sub text -->
  <text x="80" y="420" font-family="Inter,system-ui,sans-serif" font-size="22" fill="#94A3B8">Websites · ERP · CRM · AI Automation · Custom Software</text>

  <!-- Bottom bar -->
  <rect x="0" y="570" width="1200" height="60" fill="#071E3D"/>
  <text x="80" y="607" font-family="Inter,system-ui,sans-serif" font-size="18" fill="#64748B">irfatech.com</text>
  <text x="1120" y="607" font-family="Inter,system-ui,sans-serif" font-size="18" fill="#38BDF8" text-anchor="end">Free Consultation →</text>
</svg>
