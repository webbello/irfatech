# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Sveltia CMS config for IRFAtech.
#
# LOCAL EDITING (works right now, no setup):
#   1. pnpm dev
#   2. Open http://localhost:4321/admin/ in Chrome or Edge (needs the File
#      System Access API — Firefox/Safari can't do local-repo editing)
#   3. Click "Work with Local Repository" and select the Astro-Rocket
#      project's root folder
#   4. Edit content — changes are written straight to the files on disk
#   5. Review with `git diff`, then commit/push yourself as normal
#
# REMOTE EDITING (edit from anywhere, no local checkout):
#   The `backend.repo` below is a PLACEHOLDER (webbello/irfatech) — this
#   repo's `origin` remote is still the upstream theme repo, not a real
#   IRFAtech deployment. Once there's a real GitHub repo to point at:
#   1. Replace `repo:` below with the actual `owner/name`
#   2. Register a GitHub OAuth App (or deploy Sveltia's small OAuth
#      Cloudflare Worker — see https://github.com/sveltia/sveltia-cms-auth)
#      and set `base_url`/`auth_endpoint` here to match
#   3. Visit /admin/ and sign in with GitHub
#   Until that's done, only local-repository editing works — this file
#   still needs *some* valid backend block for Sveltia to boot, but it's
#   never actually contacted in local mode.
backend:
  name: github
  repo: webbello/irfatech
  branch: main

# Default media location for fields that don't override it below (the
# marketing-content JSON fields further down don't use images).
media_folder: /public/uploads
public_folder: /uploads

media_libraries:
  default:
    config:
      max_file_size: 5242880
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 2048

i18n:
  structure: multiple_folders
  locales: [en, id, pt, tet]
  default_locale: en

collections:
  # =========================================================================
  # CONTENT — blog posts, projects, solution pages. Each is a folder
  # collection under multiple_folders i18n: creating a translation adds a
  # matching file under content/<collection>/<locale>/<slug>.mdx
  # automatically.
  # =========================================================================
  - name: blog
    label: Blog Posts
    label_singular: Post
    folder: src/content/blog
    create: true
    slug: '{{slug}}'
    i18n: true
    extension: mdx
    format: frontmatter
    # Plain public/ folder, absolute web path — not a src/assets relative
    # path. A src/assets image processed through Astro's image() schema
    # helper isn't servable at any real URL until the build pipeline runs,
    # so this editor's own preview could never render one; public/ files
    # are directly fetchable, so the preview (and the frontend) both just
    # work. See the comment on `image` in content.config.ts's blog schema.
    media_folder: /public/uploads/blog
    public_folder: /uploads/blog
    fields:
      - { label: Title, name: title, widget: string, i18n: true }
      - { label: Description, name: description, widget: text, i18n: true, hint: 'Max 200 characters — used for meta description and card previews.' }
      - { label: 'Published Date', name: publishedAt, widget: datetime, i18n: duplicate }
      - { label: 'Updated Date', name: updatedAt, widget: datetime, required: false, i18n: duplicate }
      - { label: Author, name: author, widget: string, default: Team, i18n: duplicate }
      - label: 'Cover Visual'
        name: coverType
        widget: select
        required: false
        i18n: duplicate
        options:
          - { label: 'Auto (SVG icon wins if both are set)', value: auto }
          - { label: 'Uploaded Image', value: image }
          - { label: 'Decorative Icon (SVG)', value: svg }
          - { label: 'None', value: none }
        hint: 'Controls which visual shows below the title. Pick "Uploaded Image" to make sure the image displays even if a Decorative SVG Slug is still set below — no need to clear it first.'
      - { label: 'Cover Image', name: image, widget: image, required: false, i18n: true }
      - { label: 'Cover Image Alt Text', name: imageAlt, widget: string, required: false, i18n: true }
      - { label: Tags, name: tags, widget: list, required: false, i18n: duplicate }
      - { label: 'Decorative SVG Slug', name: svgSlug, widget: string, required: false, i18n: duplicate, hint: 'Matches a file in src/assets/blog/<slug>.svg. Only used when Cover Visual above is "Auto" or "Decorative Icon".' }
      - label: 'Stable ID (uid)'
        name: uid
        widget: compute
        value: '{{fields.title | slugify}}'
        i18n: duplicate
        hint: 'Auto-generated from the title — used for internal links that survive future renames. Nothing to fill in here.'
      - { label: Draft, name: draft, widget: boolean, default: false, i18n: duplicate }
      - { label: Featured, name: featured, widget: boolean, default: false, i18n: duplicate }
      - &locale_field
        label: Locale
        name: locale
        widget: select
        options: [en, id, pt, tet]
        default: en
        i18n: true
        hint: 'Must match the locale of this translation (shown in the tab above) — folder placement is automatic, but this field is also read directly.'
      - label: 'FAQs (optional — adds FAQ schema to this post)'
        name: faqs
        widget: list
        required: false
        i18n: true
        fields:
          - { label: Question, name: question, widget: string }
          - { label: Answer, name: answer, widget: text }
      - { label: 'Hide Table of Contents', name: toc, widget: boolean, required: false, i18n: duplicate }
      - { label: 'Hide Comments', name: comments, widget: boolean, required: false, i18n: duplicate }
      - { label: Body, name: body, widget: markdown, i18n: true }

  - name: projects
    label: Projects
    label_singular: Project
    folder: src/content/projects
    create: true
    slug: '{{slug}}'
    i18n: true
    extension: mdx
    format: frontmatter
    # Same reasoning as the blog collection above — relative to folder:
    # (src/content/projects), not the entry's own locale subfolder.
    media_folder: '/public/uploads/projects'
    public_folder: '/uploads/projects'
    fields:
      - { label: Title, name: title, widget: string, i18n: true }
      - { label: Description, name: description, widget: text, i18n: true }
      - { label: Icon, name: icon, widget: string, required: false, i18n: duplicate, hint: 'Lucide icon name shown on the project card, e.g. car, rocket, layers.' }
      - { label: 'Live URL', name: url, widget: string, required: false, i18n: duplicate }
      - { label: 'Repo URL', name: repo, widget: string, required: false, i18n: duplicate }
      - { label: 'Hero Image', name: image, widget: image, required: false, i18n: true }
      - { label: 'Hero Image Alt Text', name: imageAlt, widget: string, required: false, i18n: true }
      - label: Gallery
        name: gallery
        widget: list
        required: false
        i18n: true
        hint: 'Optional — when set, replaces the single Hero Image with a swipeable carousel.'
        types:
          - label: Image
            name: image_slide
            widget: object
            fields:
              - { label: Image, name: src, widget: image }
              - { label: 'Alt Text', name: alt, widget: string }
          - label: Video
            name: video_slide
            widget: object
            fields:
              - { label: 'Video Path', name: video, widget: string, hint: 'Root-relative path to a file in public/, e.g. /videos/demo.mp4' }
              - { label: Poster, name: poster, widget: image }
              - { label: 'Alt Text', name: alt, widget: string }
      - { label: Tags, name: tags, widget: list, required: false, i18n: duplicate }
      - { label: Featured, name: featured, widget: boolean, default: false, i18n: duplicate }
      - { label: 'Sort Order (lower = earlier)', name: order, widget: number, default: 99, i18n: duplicate }
      - { label: Year, name: year, widget: number, required: false, i18n: duplicate }
      - { label: Client, name: client, widget: string, required: false, i18n: duplicate }
      - { label: 'Our Role', name: role, widget: string, required: false, i18n: duplicate }
      - { label: Services, name: services, widget: list, required: false, i18n: duplicate }
      - { label: 'Meta Facts Line', name: meta, widget: list, required: false, i18n: true, hint: 'Short facts shown as one line under the hero, e.g. "Live client site", "Astro-built".' }
      - { label: Draft, name: draft, widget: boolean, default: false, i18n: duplicate }
      - { label: 'Placeholder (no detail page)', name: placeholder, widget: boolean, default: false, i18n: duplicate }
      - { label: 'Hide Table of Contents', name: toc, widget: boolean, required: false, i18n: duplicate }
      - *locale_field
      - { label: Body, name: body, widget: markdown, i18n: true }

  - name: solutions
    label: Solutions
    label_singular: Solution
    folder: src/content/solutions
    create: true
    slug: '{{slug}}'
    i18n: true
    extension: mdx
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string, i18n: true, hint: 'Also the nav/card label, e.g. "School Inspection".' }
      - { label: Sector, name: sector, widget: string, i18n: true, hint: 'Badge shown in the hero and on the index card, e.g. Government, Healthcare.' }
      - { label: Headline, name: headline, widget: string, i18n: true, hint: 'Problem-first H1, distinct from Title.' }
      - { label: Description, name: description, widget: text, i18n: true }
      - { label: Icon, name: icon, widget: string, default: layers, i18n: duplicate }
      - { label: 'The Challenge (paragraphs)', name: challenge, widget: list, i18n: true, field: { label: Paragraph, name: paragraph, widget: text } }
      - label: 'Our Approach (checklist)'
        name: approach
        widget: list
        i18n: true
        summary: '{{fields.lead}}'
        fields:
          - { label: Lead, name: lead, widget: string }
          - { label: Text, name: text, widget: text }
      - label: 'Outcomes (benefit cards)'
        name: outcomes
        widget: list
        i18n: true
        summary: '{{fields.title}}'
        fields:
          - { label: Icon, name: icon, widget: string, required: false }
          - { label: Title, name: title, widget: string }
          - { label: Description, name: description, widget: text }
      - { label: 'Related Solution Slugs', name: related, widget: list, required: false, i18n: duplicate, hint: 'Slugs of other solutions to cross-link at the foot of the page.' }
      - { label: 'Sort Order', name: order, widget: number, default: 99, i18n: duplicate }
      - { label: Featured, name: featured, widget: boolean, default: false, i18n: duplicate }
      - { label: Draft, name: draft, widget: boolean, default: false, i18n: duplicate }
      - *locale_field
      - { label: Body, name: body, widget: markdown, required: false, i18n: true }

  # =========================================================================
  # STACK — the tech-stack logos shown on the About page and homepage
  # marquee. No i18n: not user-facing copy, just tool names/links.
  # =========================================================================
  - name: stack
    label: 'Tech Stack'
    label_singular: Tool
    folder: src/content/stack
    create: true
    slug: '{{slug}}'
    extension: mdx
    format: frontmatter
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Version, name: version, widget: string }
      - { label: URL, name: url, widget: string }
      - { label: Icon, name: icon, widget: string, hint: 'Icon name, e.g. brand-astro, brand-laravel.' }
      - { label: 'Colour (OKLCH params)', name: colorOklch, widget: string, hint: 'e.g. "62.5% 0.22 38" — no oklch() wrapper.' }
      - { label: 'Sort Order', name: order, widget: number, default: 0 }

  # =========================================================================
  # AUTHORS — blog byline info. No i18n: a person's name/bio doesn't
  # translate per-locale in this schema.
  # =========================================================================
  - name: authors
    label: Authors
    label_singular: Author
    folder: src/content/authors
    create: true
    slug: '{{slug}}'
    extension: json
    format: json
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Bio, name: bio, widget: text }
      - { label: Avatar, name: avatar, widget: image, required: false }
      - label: Social
        name: social
        widget: object
        required: false
        fields:
          - { label: Twitter, name: twitter, widget: string, required: false }
          - { label: GitHub, name: github, widget: string, required: false }
          - { label: LinkedIn, name: linkedin, widget: string, required: false }

  # =========================================================================
  # FAQs — general FAQ entries used for JSON-LD FAQ schema (distinct from
  # the About/Services page's own inline FAQ accordions, which live in the
  # marketing-content file below). Filenames aren't locale-foldered
  # (general-en.json, general-id.json, ...), so this is a plain folder
  # collection rather than an i18n one — set Locale per file.
  # =========================================================================
  - name: faqs
    label: 'General FAQs'
    label_singular: FAQ
    folder: src/content/faqs
    create: true
    slug: '{{slug}}'
    extension: json
    format: json
    fields:
      - { label: Question, name: question, widget: string }
      - { label: Answer, name: answer, widget: text }
      - { label: Category, name: category, widget: string, required: false }
      - { label: 'Sort Order', name: order, widget: number, default: 0 }
      - *locale_field

  # =========================================================================
  # SITE CONTENT — the full translation dictionary (src/i18n/<locale>.json):
  # every page's marketing copy plus the UI/system strings (nav labels,
  # form placeholders, error messages, etc). One multilingual file entry
  # covering all four locales via {{locale}} in the path, editable side by
  # side in the locale tabs.
  #
  # Every top-level key from the JSON is mapped below on purpose, even the
  # rarely-touched UI strings — Sveltia's file collections write back only
  # what's defined in `fields`, so anything left unmapped here would be
  # silently dropped from the file on save. The UI-string sections (nav,
  # common, pagination, theme, search, video, footer, and the top-level
  # blog/projects/solutions/contact/errors/newsletter namespaces) are
  # grouped under "System & UI Text" and often contain {variable}
  # interpolation placeholders in curly braces (e.g. {count}, {date},
  # {platform}) — keep those exactly as shown, just translate the words
  # around them.
  # =========================================================================
  - name: site_content
    label: 'Site Content'
    files:
      - name: dictionary
        label: 'Site Content (all locales)'
        file: src/i18n/{{locale}}.json
        format: json
        i18n: true
        fields:
          - label: '📄 Homepage'
            name: pages
            widget: object
            i18n: true
            fields:
              - label: Home
                name: home
                widget: object
                fields:
                  - label: 'Meta / SEO'
                    name: meta
                    widget: object
                    collapsed: true
                    fields:
                      - { label: 'Page Title', name: title, widget: string }
                      - { label: 'Meta Description', name: description, widget: text }
                  - label: Hero
                    name: hero
                    widget: object
                    fields:
                      - { label: Badge, name: badge, widget: string }
                      - { label: 'Headline — Line 1', name: titleLine1, widget: string }
                      - { label: 'Headline — Line 2', name: titleLine2, widget: string }
                      - { label: 'Headline — Line 3', name: titleLine3, widget: string }
                      - { label: 'Description (desktop)', name: description, widget: text }
                      - { label: 'Description (mobile, shorter)', name: descriptionMobile, widget: text }
                      - { label: 'Primary Button Label', name: github, widget: string }
                      - { label: 'Secondary Button Label', name: getStarted, widget: string }
                  - label: '"Everything Connected" Section'
                    name: ecosystem
                    widget: object
                    collapsed: true
                    hint: 'The hub-and-spoke visual just under the hero.'
                    fields:
                      - { label: Heading, name: heading, widget: string }
                      - { label: 'Heading — Accent Line', name: headingAccent, widget: string }
                      - { label: Lead, name: lead, widget: text }
                      - name: features
                        label: 'Feature List (left column, 4 recommended)'
                        widget: list
                        summary: '{{fields.title}}'
                        fields: &icon_title_desc_fields
                          - { label: Icon, name: icon, widget: string, hint: 'Lucide icon name' }
                          - { label: Title, name: title, widget: string }
                          - { label: Description, name: description, widget: text }
                      - { label: 'Hub Label', name: hubLabel, widget: string }
                      - { label: 'Hub Sub-label', name: hubSubLabel, widget: string }
                      - name: nodes
                        label: 'Connected Modules (exactly 8 — arranged clockwise from the top)'
                        widget: list
                        summary: '{{fields.title}}'
                        fields:
                          - { label: Icon, name: icon, widget: string, hint: 'Lucide icon name' }
                          - { label: Title, name: title, widget: string }
                          - { label: Description, name: description, widget: text }
                          - label: Color
                            name: color
                            widget: select
                            options: [blue, orange, red, purple, green]
                            default: blue
                      - name: stats
                        label: 'Stats Row (4 recommended)'
                        widget: list
                        summary: '{{fields.title}}'
                        fields: *icon_title_desc_fields
                  - label: '"How It Works" Section'
                    name: systemsFlow
                    widget: object
                    collapsed: true
                    fields:
                      - { label: Badge, name: badge, widget: string }
                      - { label: Heading, name: heading, widget: string }
                      - { label: Lead, name: lead, widget: text }
                      - { label: '"Before" Label', name: beforeLabel, widget: string }
                      - { label: 'Hub Label', name: hubLabel, widget: string }
                      - { label: '"After" Label', name: afterLabel, widget: string }
                  - label: Services Section
                    name: services
                    widget: object
                    collapsed: true
                    fields:
                      - { label: Badge, name: badge, widget: string }
                      - { label: Heading, name: heading, widget: string }
                      - { label: Lead, name: lead, widget: text }
                      - { label: '"Learn More" Label', name: learnMore, widget: string }
                      - name: cards
                        label: Cards
                        widget: list
                        summary: '{{fields.title}}'
                        fields: *icon_title_desc_fields
                  - label: Sectors Strip
                    name: sectors
                    widget: object
                    collapsed: true
                    fields:
                      - { label: Label, name: label, widget: string }
                      - { label: 'Sector Names', name: sectors, widget: list, field: { label: Sector, name: sector, widget: string } }
                      - { label: 'CTA Label', name: cta, widget: string }
                  - label: '"Work With IRFAtech" Section'
                    name: workWithMe
                    widget: object
                    collapsed: true
                    fields:
                      - { label: Badge, name: badge, widget: string }
                      - { label: Heading, name: heading, widget: string }
                      - { label: Lead, name: lead, widget: text }
                      - { label: Cards, name: cards, widget: list, summary: '{{fields.title}}', fields: *icon_title_desc_fields }
                      - { label: 'CTA Label', name: cta, widget: string }
                  - label: Portfolio Section
                    name: portfolio
                    widget: object
                    collapsed: true
                    fields:
                      - { label: Badge, name: badge, widget: string }
                      - { label: Heading, name: heading, widget: string }
                      - { label: Lead, name: lead, widget: text }
                      - { label: '"View All" Label', name: viewAll, widget: string }
                  - label: Testimonials Section
                    name: testimonials
                    widget: object
                    collapsed: true
                    hint: 'Leave Items empty to hide the whole section — it only renders once there''s at least one real testimonial.'
                    fields:
                      - { label: Badge, name: badge, widget: string }
                      - { label: Heading, name: heading, widget: string }
                      - { label: Lead, name: lead, widget: text }
                      - label: Items
                        name: items
                        widget: list
                        required: false
                        summary: '{{fields.name}}'
                        fields:
                          - { label: Quote, name: quote, widget: text }
                          - { label: Name, name: name, widget: string }
                          - { label: 'Role / Company', name: role, widget: string }
                  - label: About Teaser Section
                    name: aboutTeaser
                    widget: object
                    collapsed: true
                    fields:
                      - { label: Badge, name: badge, widget: string }
                      - { label: 'Heading — Line 1', name: headingLine1, widget: string }
                      - { label: 'Heading — Line 2', name: headingLine2, widget: string }
                      - { label: 'Paragraph (with location)', name: para1WithLocation, widget: text, hint: 'Use {location} where the city/country should be inserted.' }
                      - { label: 'Paragraph (no location)', name: para1NoLocation, widget: text }
                      - { label: 'Paragraph 2', name: para2, widget: text }
                      - { label: '"More About Us" Label', name: moreAboutMe, widget: string }
                      - { label: 'Stats Intro', name: statsIntro, widget: string }
                      - { label: 'Stat 1', name: stat1, widget: string }
                      - { label: 'Stat 2', name: stat2, widget: string }
                      - { label: 'Stat 3', name: stat3, widget: string }
                      - { label: '"Based In" Label', name: basedIn, widget: string }
                  - label: Blog Section
                    name: blog
                    widget: object
                    collapsed: true
                    fields:
                      - { label: Badge, name: badge, widget: string }
                      - { label: Heading, name: heading, widget: string }
                      - { label: '"View All" Label', name: viewAll, widget: string }
                  - label: Final CTA Section
                    name: cta
                    widget: object
                    collapsed: true
                    fields:
                      - { label: Badge, name: badge, widget: string }
                      - { label: Heading, name: heading, widget: string }
                      - { label: Description, name: description, widget: text }
                      - { label: 'Primary Button Label', name: primary, widget: string }
                      - { label: 'Secondary Button Label', name: secondary, widget: string }
              - label: 'About Page'
                name: about
                widget: object
                collapsed: true
                fields:
                  - label: 'Meta / SEO'
                    name: meta
                    widget: object
                    collapsed: true
                    fields:
                      - { label: 'Page Title', name: title, widget: string }
                      - { label: 'Meta Description', name: description, widget: text }
                  - label: Hero
                    name: hero
                    widget: object
                    collapsed: true
                    fields:
                      - { label: Badge, name: badge, widget: string }
                      - { label: 'Title Lead-in', name: titleLead, widget: string }
                      - { label: 'Typing Words (desktop)', name: typingWords, widget: list, field: { label: Word, name: word, widget: string } }
                      - { label: 'Typing Words (mobile)', name: typingWordsMobile, widget: list, field: { label: Word, name: word, widget: string } }
                      - { label: Description, name: description, widget: text }
                  - label: '"What You Get" Section'
                    name: whatYouGet
                    widget: object
                    collapsed: true
                    fields:
                      - { label: Badge, name: badge, widget: string }
                      - { label: Heading, name: heading, widget: string }
                      - { label: Lead, name: lead, widget: text }
                      - { label: Items, name: items, widget: list, summary: '{{fields.title}}', fields: *icon_title_desc_fields }
                  - label: Principles Section
                    name: principles
                    widget: object
                    collapsed: true
                    fields:
                      - { label: Badge, name: badge, widget: string }
                      - { label: Heading, name: heading, widget: string }
                      - { label: Lead, name: lead, widget: text }
                      - { label: Items, name: items, widget: list, summary: '{{fields.title}}', fields: *icon_title_desc_fields }
                  - label: Stack Section
                    name: stack
                    widget: object
                    collapsed: true
                    fields:
                      - { label: Badge, name: badge, widget: string }
                      - { label: Title, name: title, widget: string }
                      - { label: Description, name: description, widget: text }
                  - label: FAQ Section
                    name: faq
                    widget: object
                    collapsed: true
                    fields:
                      - { label: Badge, name: badge, widget: string }
                      - { label: Heading, name: heading, widget: string }
                      - { label: Lead, name: lead, widget: text }
                      - name: cards
                        label: 'FAQ Cards'
                        widget: list
                        summary: '{{fields.title}}'
                        fields: &faq_card_fields
                          - { label: Icon, name: icon, widget: string, hint: 'Lucide icon name, e.g. building-2, handshake' }
                          - { label: 'Card Title', name: title, widget: string }
                          - label: Questions
                            name: items
                            widget: list
                            summary: '{{fields.question}}'
                            fields:
                              - { label: Question, name: question, widget: string }
                              - { label: Answer, name: answer, widget: text }
                  - label: Open Source Section
                    name: openSource
                    widget: object
                    collapsed: true
                    fields:
                      - { label: Badge, name: badge, widget: string }
                      - { label: Heading, name: heading, widget: string }
                      - { label: Description, name: description, widget: text }
                      - { label: 'Button Label', name: button, widget: string }
                      - label: Cards
                        name: cards
                        widget: list
                        summary: '{{fields.title}}'
                        fields:
                          - { label: Title, name: title, widget: string }
                          - { label: Text, name: text, widget: text, hint: 'May contain a raw <a> HTML link tag — edit carefully.' }
                  - label: Final CTA Section
                    name: cta
                    widget: object
                    collapsed: true
                    fields:
                      - { label: Badge, name: badge, widget: string }
                      - { label: Heading, name: heading, widget: string }
                      - { label: Description, name: description, widget: text }
                      - { label: 'Button Label', name: button, widget: string }
              - label: 'Services Page'
                name: services
                widget: object
                collapsed: true
                fields:
                  - label: 'Meta / SEO'
                    name: meta
                    widget: object
                    collapsed: true
                    fields:
                      - { label: 'Page Title', name: title, widget: string }
                      - { label: 'Meta Description', name: description, widget: text }
                  - { label: '"What''s Included" Label', name: includedLabel, widget: string }
