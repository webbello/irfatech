<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="g1" cx="35%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#020B18" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="85%" cy="15%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#020B18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="headline-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#020B18"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>

  <!-- Grid lines -->
  <g stroke="#0EA5E9" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#headline-grad)"/>

  <!-- Logo block -->
  <rect x="80" y="72" width="52" height="52" rx="12" fill="#0EA5E9"/>
  <text x="106" y="108" font-family="system-ui,sans-serif" font-size="30" font-weight="700" fill="white" text-anchor="middle">⚡</text>
  <text x="148" y="108" font-family="Arial,system-ui,sans-serif" font-size="32" font-weight="800" fill="white">IRFA<tspan fill="#38BDF8">tech</tspan></text>
  <text x="148" y="132" font-family="Arial,system-ui,sans-serif" font-size="14" fill="#475569">Integrated Resources For Automation</text>

  <!-- Main headline -->
  <text x="80" y="260" font-family="Arial,system-ui,sans-serif" font-size="62" font-weight="800" fill="white">Digital Infrastructure</text>
  <text x="80" y="336" font-family="Arial,system-ui,sans-serif" font-size="62" font-weight="800" fill="url(#headline-grad)">for Growing Businesses</text>

  <!-- Sub text -->
  <text x="80" y="396" font-family="Arial,system-ui,sans-serif" font-size="22" fill="#94A3B8">Websites · ERP · CRM · AI Automation · Custom Software</text>

  <!-- Pills row -->
  <rect x="80" y="430" width="130" height="36" rx="18" fill="url(#badge-grad)" stroke="#0EA5E9" stroke-opacity="0.3" stroke-width="1"/>
  <text x="145" y="453" font-family="Arial,system-ui,sans-serif" font-size="14" fill="#38BDF8" text-anchor="middle">15+ Years</text>

  <rect x="224" y="430" width="160" height="36" rx="18" fill="url(#badge-grad)" stroke="#6366F1" stroke-opacity="0.3" stroke-width="1"/>
  <text x="304" y="453" font-family="Arial,system-ui,sans-serif" font-size="14" fill="#818CF8" text-anchor="middle">India-Based</text>

  <rect x="398" y="430" width="180" height="36" rx="18" fill="url(#badge-grad)" stroke="#0EA5E9" stroke-opacity="0.3" stroke-width="1"/>
  <text x="488" y="453" font-family="Arial,system-ui,sans-serif" font-size="14" fill="#38BDF8" text-anchor="middle">Free Consultation</text>

  <!-- Bottom bar -->
  <rect x="0" y="575" width="1200" height="55" fill="#071E3D"/>
  <text x="80" y="609" font-family="Arial,system-ui,sans-serif" font-size="16" fill="#64748B">irfatech.in</text>
  <text x="1120" y="609" font-family="Arial,system-ui,sans-serif" font-size="16" fill="#38BDF8" text-anchor="end">Book Free Consultation →</text>
